[package]
name = "optimizam"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Linear, mixed-integer, constraint, and global nonlinear optimization in pure Rust, as a library and a command"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hillegass/optimizam"
readme = "README.md"
keywords = ["optimization", "milp", "linear-programming", "constraint-solver", "nonlinear"]
categories = ["mathematics", "science", "algorithms", "command-line-utilities"]
exclude = ["/tools", "/skills", "/RESULTS.md", "/PROPOSALS.md", "/CLAUDE.md", "/.github", "/rustfmt.toml"]

[features]
default = ["cli"]
# The `optimizam` command. Libraries can turn it off (default-features = false)
# to leave out clap and ctrlc.
cli = ["dep:clap", "dep:ctrlc"]

[[bin]]
name = "optimizam"
required-features = ["cli"]

# Runs the command on every example.
[[test]]
name = "regression"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
ctrlc = { version = "3.5.2", features = ["termination"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
